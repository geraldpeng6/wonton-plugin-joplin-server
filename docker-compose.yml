# Joplin 笔记同步：Joplin Server 加 Postgres，笔记在手机、电脑之间同步。
# 网页管理页经核心网关打开（应用自带登录）；手机、电脑上的 Joplin 客户端连局域网端口 22300（lan.client）。
# 上游镜像按清单列表（index）摘要固定；Joplin Server 是 "Joplin Server Personal Use License"，见 NOTICE。
services:
  db:
    # 上游官方 compose 用 postgres:16；数据卷保留在 ${WONTON_APP_DATA}，大版本升级要手动迁移。
    image: postgres:16.15@sha256:f9a7b9ebf6f56201f949db745e47bc423c0f0f8294bafe991cc10bf74b029657
    environment:
      POSTGRES_DB: joplin
      POSTGRES_USER: joplin
      POSTGRES_password: ${WONTON_SECRET_POSTGRES}
    volumes:
      - ${WONTON_APP_DATA}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U joplin -d joplin"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      start_interval: 1s

  server:
    # 镜像多架构（amd64、arm64 同一个清单列表摘要）。镜像以非 root 用户 joplin 运行，不认 PUID/PGID；
    # 笔记数据全部存在 Postgres 里，容器不需要挂数据目录。
    image: joplin/server:3.7.5@sha256:2bf372c0eac43a3bd47440b7b3044feefe3423eb33649a836eb8d9499934b3b3
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_PORT: 22300
      # 网页登录后重定向到 ${APP_BASE_URL}/home，必须写主人浏览器访问的网关地址，否则网页登录回不来。
      # Joplin 客户端同步不读这个值：客户端直连局域网端口 22300（见 README），实测见 PR。
      APP_BASE_URL: ${WONTON_APP_URL}
      DB_CLIENT: pg
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DATABASE: joplin
      POSTGRES_USER: joplin
      POSTGRES_password: ${WONTON_SECRET_POSTGRES}
      # 发信走核心的信箱（notify 权限）：注册确认、找回密码。核心的 SMTP 不加密、按来源认插件，
      # 显式关掉 STARTTLS/TLS；不发用户名密码（nodemailer 会在明文连接上做 AUTH，反而失败）。
      MAILER_ENABLED: "1"
      MAILER_HOST: ${WONTON_SMTP_HOST}
      MAILER_PORT: ${WONTON_SMTP_PORT}
      MAILER_SECURITY: none
      MAILER_NOREPLY_EMAIL: ${WONTON_MAIL_FROM}
      MAILER_NOREPLY_NAME: Joplin
    healthcheck:
      # 镜像里没有 wget/curl，用 Node 自带的 fetch 检查真的能应答。
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:22300/api/ping').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      start_interval: 5s

  # 一次性服务：上游镜像自带默认管理员 admin@localhost/admin，不能留着。
  # 等主服务健康后，用它的 API 把默认管理员的邮箱改成主人的内部邮箱、密码换成核心生成的密码
  # （Joplin 客户端按邮箱+密码登录，这个账号就是 lan.client 显示的账号）。脚本幂等，重装时直接用新账号验一遍。
  provision:
    image: joplin/server:3.7.5@sha256:2bf372c0eac43a3bd47440b7b3044feefe3423eb33649a836eb8d9499934b3b3
    depends_on:
      server:
        condition: service_healthy
    entrypoint: ["node", "/app/init.js"]
    environment:
      WONTON_OWNER_EMAIL: ${WONTON_OWNER_EMAIL:?核心没有注入用户邮箱}
      WONTON_SECRET_CLIENT: ${WONTON_SECRET_CLIENT}
    configs:
      - source: provision
        target: /app/init.js
    restart: "no"

configs:
  provision:
    file: provision.js

x-wonton:
  spec: "0.12"
  id: org.joplinapp.joplin-server
  version: 0.1.0
  kind: app
  title: { zh: 笔记同步（Joplin）, en: Note Sync (Joplin) }
  description: { zh: 像有道云笔记，你的笔记存在家里，手机和电脑上的 Joplin 笔记本之间自动同步, en: "Like a personal Evernote, your notes stay at home and sync between the Joplin apps on your phone and computer" }
  icon: icon.svg
  notices: [NOTICE]
  screenshots: [screenshots/login.png, screenshots/home.png]
  author: { name: geraldpeng6 }
  homepage: https://joplinapp.org
  # Joplin Server 只许个人使用（Joplin Server Personal Use License，不是开源许可证），全文见 NOTICE。
  license: LicenseRef-Joplin-Server-Personal-Use
  tags:
    zh: [笔记, 同步]
    en: [Notes, Sync]
  about:
    zh: |
      手机、电脑上的 Joplin 笔记本，笔记自动存到你家里的服务器，随时换设备接着写。

      要配合免费的 Joplin 笔记本应用使用：先在手机或电脑上装 Joplin，然后在插件详情里打开“在局域网开放”，
      把显示的地址、账号和密码填进 Joplin 的同步设置。

      网页上是管理页，平时写笔记用 Joplin 应用就好。
    en: |
      Your Joplin notebooks on your phone and computer sync through the server at home, so you can pick up any device and keep writing.

      Works with the free Joplin app: install Joplin on your phone or computer, turn on the LAN switch in the plugin details, and enter the address, account and password shown there into Joplin's sync settings.

      The web page is the admin console; for everyday notes, use the Joplin app.
  release_notes: { zh: 首个版本。, en: Initial release. }
  webui:
    service: server
    port: 22300
    sso: none
  # 手机、电脑上的 Joplin 客户端连这个端口同步。Joplin 按邮箱+密码登录，账号是主人的内部邮箱。
  lan:
    ports:
      - { service: server, port: 22300 }
    client:
      address: "http://{host}:22300"
      username: "{email}"
      password: "{secret:client}"
  secrets:
    postgres:
      generate: { bytes: 32 }
    client:
      generate: { bytes: 32 }
  permissions:
    # Joplin 客户端在局域网里直连 22300 同步。
    - network.lan
    # 发信（找回密码等）走核心的信箱。
    - notify
    # 建账号要用主人的内部邮箱（Joplin 按邮箱登录）。
    - owner.identity
  # 上游没写最低内存；本机实测 server 常驻约 300M、Postgres 约 50M，取 512M。镜像 amd64、arm64 都有。
  requirements:
    arch: [amd64, arm64]
    memory: 512M
